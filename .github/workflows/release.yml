name: Release Heroku

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit in dentarg/heroku-cli
        required: true
        default: local-fixes
        type: string

permissions:
  contents: read

concurrency:
  group: release-heroku
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dentarg/heroku-cli
          ref: ${{ inputs.source_ref }}
          path: cli
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test release numbering
        run: node --test scripts/release-plan.test.mjs
      - name: Choose next revision
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-plan.mjs cli
      - name: Build release
        env:
          REVISION: ${{ steps.plan.outputs.revision }}
        run: node scripts/prepare-release.mjs cli "$REVISION"
      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heroku-release
          path: |
            Formula/heroku.rb
            releases/
          if-no-files-found: error

  test:
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: heroku-release
      - name: Install and test release candidate
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: node scripts/test-formula.mjs "$RELEASE_TAG"

  publish:
    needs:
      - build
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Ensure tap has not changed during testing
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo 'The tap changed during this run; dispatch a new release.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: heroku-release
      - name: Publish release and formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          release_dir="releases/$RELEASE_TAG"
          version=$(jq -r .version "$release_dir/release.json")
          revision=$(jq -r .revision "$release_dir/release.json")
          source_commit=$(jq -r .commit "$release_dir/release.json")

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/heroku.rb
          cat > "$RUNNER_TEMP/commit-message" <<EOF
          chore: release Heroku ${version}_${revision}

          Package CLI commit ${source_commit}.

          Publish the tested archive with locked dependencies and a checksum
          so Homebrew installs this snapshot of the local fixes.
          EOF
          git commit --allow-empty -F "$RUNNER_TEMP/commit-message"
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

          gh release create "$RELEASE_TAG" \
            "$release_dir/heroku-$version.tgz" \
            "$release_dir/SHA256SUMS" \
            "$release_dir/release.json" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Heroku $version, dentarg revision $revision" \
            --notes-file "$release_dir/notes.md"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

          # Expose the formula only after its download URL is live.
          git push origin HEAD:main
          echo "Published $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
