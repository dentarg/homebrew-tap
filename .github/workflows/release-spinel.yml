name: Release Spinel

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit in matz/spinel
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: release-spinel
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      archive: ${{ steps.build.outputs.archive }}
    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Spinel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: matz/spinel
          ref: ${{ inputs.source_ref || 'master' }}
          path: spinel
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test version naming
        run: node --test scripts/spinel-version.test.mjs
      - name: Skip a snapshot that is already released
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="spinel-$(node scripts/prepare-spinel.mjs --version spinel)"
          # A tag or a draft release reserves the version, as for Heroku
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1 ||
             gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag exists, nothing to release" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release
        id: build
        if: steps.plan.outputs.tag
        run: node scripts/prepare-spinel.mjs spinel
      - name: Upload release candidate
        if: steps.plan.outputs.tag
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spinel-release
          path: |
            Formula/spinel.rb
            releases/
          if-no-files-found: error

  test:
    needs:
      - build
    if: needs.build.outputs.tag
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spinel-release
      - name: Install and test release candidate
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: node scripts/brew-test.mjs spinel "releases/$RELEASE_TAG/$ARCHIVE"

  publish:
    needs:
      - build
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Ensure tap has not changed during testing
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo 'The tap changed during this run; dispatch a new release.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spinel-release
      - name: Publish release and formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          release_dir="releases/$RELEASE_TAG"
          release=$(jq -r .release "$release_dir/release.json")
          archive=$(jq -r .archive "$release_dir/release.json")
          source_commit=$(jq -r .commit "$release_dir/release.json")

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/spinel.rb
          cat > "$RUNNER_TEMP/commit-message" <<EOF
          chore: release Spinel ${release}

          Package matz/spinel commit ${source_commit}.

          Publish the tested source snapshot with its vendored parsers and
          a checksum so Homebrew builds this revision of Spinel.
          EOF
          git commit -F "$RUNNER_TEMP/commit-message"
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

          gh release create "$RELEASE_TAG" \
            "$release_dir/$archive" \
            "$release_dir/SHA256SUMS" \
            "$release_dir/release.json" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Spinel $release" \
            --notes-file "$release_dir/notes.md"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

          # Expose the formula only after its download URL is live.
          git push origin HEAD:main
          echo "Published $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
